name: publish
on:
    push:
        branches: [main]
jobs:
    publish:
        permissions:
            id-token: write

        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: DotNet Setup
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "11.x"
              env:
                  NUGET_PACKAGES: ${{ runner.temp }}/nuget/packages

            - name: DotNet Pack
              run: find ./source -name '*.csproj' -exec dotnet pack {} --configuration Release --output packages \;

            - name: NuGet Login
              uses: NuGet/login@v1
              id: login
              with:
                  user: rafaelfgx

            - name: NuGet Delete
              run: curl -s https://azuresearch-usnc.nuget.org/query?q=owner:rafaelfgx | jq -r '.data[] | "dotnet nuget delete \(.id) \(.version) --non-interactive --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}"' | xargs -I {} bash -c "{}"

            - name: NuGet Push
              run: dotnet nuget push "packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate --no-symbols
